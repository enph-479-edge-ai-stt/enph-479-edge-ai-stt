name: CI

# Per-vertical jobs. Each vertical is an independent uv project, so its job runs
# in that vertical's directory and only runs when that vertical (or this file)
# changes. Add a filter and a job per vertical as it grows Python code.
#
# The workflow itself runs on every PR and the `changes` job decides which
# vertical jobs run. Don't move the path filter back to `on.paths`: `training` is
# a required check on main, and a job skipped by `if:` reports success, but a
# workflow skipped by `on.paths` leaves the check pending and blocks the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      training: ${{ steps.filter.outputs.training }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      # PRs are diffed through the API; pushes to main are diffed with git, which needs the checkout.
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            training:
              - "training/**"
              - "shared/**"
              - ".github/workflows/ci.yml"
            runtime:
              - "runtime/**"
              - "shared/**"
              - ".github/workflows/ci.yml"

  training:
    needs: changes
    if: needs.changes.outputs.training == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "training/uv.lock"

      # No OneDrive on CI, so the default in-repo .venv is fine here.
      # Python 3.12.0 is pinned by training/.python-version and fetched by uv if missing.
      # The wlm extra is kenlm, built from source with clang (uv's Python is clang-built
      # and passes a flag gcc rejects), so the decoder's golden case runs here too.
      - name: Sync (installs the dev group of ruff and pytest, and the wlm extra)
        run: uv sync --frozen --extra wlm
        env:
          CC: clang
          CXX: clang++

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "runtime/uv.lock"

      # Python 3.10 (the board's) is pinned by runtime/.python-version. kenlm as in training.
      - name: Sync (installs the dev group of ruff and pytest, and the wlm extra)
        run: uv sync --frozen --extra wlm
        env:
          CC: clang
          CXX: clang++

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest
