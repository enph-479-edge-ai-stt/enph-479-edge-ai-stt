[project]
name = "stt-training"
version = "0.1.0"
description = "ENPH 479 STT — offline training pipeline: CTC-LSTM acoustic model, char-LM, KenLM word-LM, exported to QONNX for a Kria KV260."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Kai Asaoka" },
    { name = "Sudharshan Kannan" },
    { name = "Andrew Du" },
    { name = "Anubhav Saini" },
]
dependencies = [
    # Light, cross-platform deps stay locked. jiwer = CER/WER; soundfile (bundled
    # libsndfile) loads FLAC without torchaudio's TorchCodec I/O backend; numpy
    # backs both soundfile and torch's array interop.
    "jiwer>=3.0",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[dependency-groups]
# Dev tooling only. torch and torchaudio (the heavy ML stack this stage needs)
# are deliberately NOT locked here: on Colab they are preinstalled, and locally
# you install a CPU build for tests with `uv pip install torch torchaudio`
# before `uv run pytest`. Keeping them out of the lock keeps `uv sync` fast and
# avoids resolving giant, platform-specific CUDA wheels. The AM tests skip
# themselves when torch/torchaudio are absent (see tests/test_am.py).
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the importable package is training/src/training/ -> `training`.
packages = ["src/training"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "D",   # pydocstyle (Google-style docstrings)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and launcher notebooks are exempt from docstring-PRESENCE rules (D1xx);
# the structural docstring checks (D2xx/D4xx) still apply to any docstring they
# do carry, so a docstring that exists must still be well-formed.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"notebooks/**" = ["D100", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["training"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
# src layout: put src/ on sys.path so `import training` resolves even without
# an editable install (belt-and-suspenders alongside `uv sync`).
pythonpath = ["src"]
